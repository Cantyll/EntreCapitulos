# Atualizações semanais de dependências, agrupadas, no máximo 5 PRs abertos por ecossistema.
# O Dependabot de github-actions mantém os SHAs fixados nos workflows (e o comentário "# vX.Y.Z").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
