name: Prova de restauração do backup

# Toda semana: baixa o backup semanal mais recente do R2, descriptografa e restaura num Supabase LOCAL
# efêmero DENTRO do runner, comparando as contagens com o manifesto. Também confere a idade dos backups
# (diário até 36 h; semanal até 8 dias). O texto puro nunca sai do runner. Se falhar, o GitHub avisa
# pelas notificações (quem editou o agendamento por último).
#
# Segurança: só schedule e workflow_dispatch (nunca pull_request); segredos no Environment "backup"
# (restrito à main); sem artefatos, sem cache, sem "set -x".
on:
  schedule:
    # Domingo, 07:41 UTC: depois do backup das 06:23, que cria a cópia semanal.
    - cron: '41 7 * * 0'
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Mostrar a saída das ferramentas, filtrada (nunca mostra dados). Só vale no disparo manual'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup-drill
  cancel-in-progress: false

jobs:
  drill:
    name: Restaurar num banco local descartável
    if: github.repository == 'Cantyll/EntreCapitulos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Preparar pasta temporária
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          echo "BACKUP_WORKDIR=$RUNNER_TEMP/backup" >> "$GITHUB_ENV"

      - name: Conferir a idade dos backups
        run: bash scripts/backup/drill.sh freshness
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_VERBOSE: ${{ github.event_name == 'workflow_dispatch' && inputs.verbose && 'true' || 'false' }}

      # Banco local descartável, com as migrations deste commit (e o seed, que a restauração esvazia).
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,realtime,supavisor

      - name: Baixar, descriptografar e restaurar
        run: bash scripts/backup/drill.sh restore
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_VERBOSE: ${{ github.event_name == 'workflow_dispatch' && inputs.verbose && 'true' || 'false' }}

      - name: Apagar os temporários
        if: always()
        run: |
          source scripts/backup/common.sh
          wipe_dir "$BACKUP_WORKDIR"
