name: E2E

# Testes de ponta a ponta (Playwright) contra um build de PRODUÇÃO e um Supabase local, ambos atrás de
# HTTPS local. Sem nenhum secret. Não é obrigatório para o merge: serve de rede de segurança.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium e WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache dos navegadores do Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Com o cache cheio só instala as bibliotecas do sistema; sem ele baixa os navegadores também.
      - name: Navegadores do Playwright
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # Auth, Storage, Postgres, PostgREST e Mailpit ficam; o resto não é usado pelos testes.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,realtime,supavisor

      - name: Build de produção do app
        run: npm run e2e:build

      - name: Testes E2E
        run: npx playwright test

      - name: Log do app (só em falha)
        if: failure()
        run: tail -n 300 e2e/.tmp/app.log || true

      - name: Relatório, traces e screenshots (só em falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-falha
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
