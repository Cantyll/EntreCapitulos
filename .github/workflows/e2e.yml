name: E2E

# Testes de ponta a ponta (Playwright) contra um build de PRODUÇÃO e um Supabase local, ambos atrás de
# HTTPS local. Sem nenhum secret. Não é obrigatório para o merge: serve de rede de segurança.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium e WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache dos navegadores do Playwright
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Com o cache cheio só instala as bibliotecas do sistema; sem ele baixa os navegadores também.
      - name: Navegadores do Playwright
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0

      # Auth, Storage, Postgres, PostgREST e Mailpit ficam; o resto não é usado pelos testes.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,realtime,supavisor

      - name: Build de produção do app
        run: npm run e2e:build

      - name: Testes E2E
        run: npx playwright test

      - name: Log do app (só em falha)
        if: failure()
        run: tail -n 300 e2e/.tmp/app.log || true

      - name: Relatório, traces e screenshots (só em falha)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-falha
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
