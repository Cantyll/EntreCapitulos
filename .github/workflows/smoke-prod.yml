name: Smoke test da produção

# Só leitura, sem login e sem nenhum secret: abre o site público e confere rotas, cabeçalhos, manifest,
# robots, console limpo, redirecionamento do painel e o 404. Roda todo dia e sob demanda. Se falhar, o
# GitHub avisa por e-mail e pelas notificações (quem editou o agendamento por último).
on:
  workflow_dispatch:
  schedule:
    # 09:17 UTC (06:17 em Brasília), fora do horário cheio.
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: smoke-prod
  cancel-in-progress: true

jobs:
  smoke:
    name: Site em produção
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npx playwright test --config=playwright.smoke.config.ts

      - name: Relatório e screenshots (só em falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-falha
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
