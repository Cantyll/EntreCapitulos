name: Verificar credenciais do backup

# SÓ à mão (Actions → Verificar credenciais do backup → Run workflow). Valida as credenciais do Environment
# escolhido SEM gerar nem enviar backup e SEM restaurar nada: formato dos segredos, R2, Supabase e
# frase-senha. O resultado aparece no resumo do job (tabela Item, Resultado, Motivo, O que fazer) e nas
# anotações no topo da execução. Só texto fixo: nunca valor de segredo nem saída bruta de ferramenta.
# Rode-o depois de criar ou trocar um segredo e antes do primeiro backup (docs/operacao.md, seção 15).
#
# - Environment "backup": o mesmo conjunto do backup.yml. Escreve e apaga um objeto minúsculo em _preflight/
#   no bucket (nunca em daily/ nem weekly/).
# - Environment "restore": só leitura no R2, frase-senha e, se já existirem, o projeto de destino. NÃO escreve
#   no bucket. A execução pede a sua aprovação, como qualquer uso desse Environment.
#
# Segurança: só workflow_dispatch (nunca pull_request); a entrada "environment" é uma escolha fechada
# (backup ou restore, nunca texto livre) e o job ainda confere o valor antes de iniciar; segredos só por env:
# do passo; os segredos de produção do Supabase só chegam ao script no Environment backup.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment a verificar. Com restore, a execução pede a sua aprovação'
        type: choice
        options:
          - backup
          - restore
        default: backup
      passphrase_rotated:
        description: 'Troquei a frase-senha de propósito: não comparar com os backups anteriores (depois, rode o backup manual uma vez com force_weekly)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: credentials-check
  cancel-in-progress: false

jobs:
  check:
    name: Verificar as credenciais
    if: github.repository == 'Cantyll/EntreCapitulos' && github.ref == 'refs/heads/main' && (inputs.environment == 'backup' || inputs.environment == 'restore')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Verificar as credenciais
        run: bash scripts/backup/preflight.sh
        env:
          PREFLIGHT_SCOPE: check-${{ inputs.environment }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ inputs.environment == 'backup' && secrets.SUPABASE_DB_PASSWORD || '' }}
          SUPABASE_PROJECT_REF: ${{ inputs.environment == 'backup' && secrets.SUPABASE_PROJECT_REF || '' }}
          RESTORE_TARGET_PROJECT_REF: ${{ inputs.environment == 'restore' && secrets.RESTORE_TARGET_PROJECT_REF || '' }}
          RESTORE_TARGET_DB_PASSWORD: ${{ inputs.environment == 'restore' && secrets.RESTORE_TARGET_DB_PASSWORD || '' }}
          PREFLIGHT_PASSPHRASE_ROTATED: ${{ github.event_name == 'workflow_dispatch' && inputs.passphrase_rotated && 'true' || 'false' }}

      # Sempre roda (mesmo que o passo acima falhe): a tabela precisa existir.
      - name: Resumo da verificação
        if: always()
        run: bash scripts/backup/preflight-summary.sh
        env:
          PREFLIGHT_SCOPE: check-${{ inputs.environment }}

      - name: Apagar os temporários
        if: always()
        run: |
          source scripts/backup/common.sh
          wipe_dir "$RUNNER_TEMP/preflight"
