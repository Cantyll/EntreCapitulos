name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Sem nenhum secret: tudo roda contra um banco Supabase local, descartável.
jobs:
  app:
    name: Lint, tipos, formatação e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build

  database:
    name: Banco (pgTAP e tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # Aplica as migrations e o seed num Postgres local (o seed só existe para desenvolvimento).
      - name: Start local Supabase
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

      # docs/seguranca.md é gerado do banco: falha se uma migration mudou permissões e o documento não.
      # Regenerar: UPDATE_SECURITY_DOC=1 (ver o cabeçalho do próprio documento).
      - name: Security inventory matches docs/seguranca.md
        run: npx vitest run tests/security-doc.test.ts
        env:
          SECURITY_DOC_DB_CONTAINER: supabase_db_entre-capitulos

      - name: Generate types
        run: npm run db:types

      - name: Fail if database.types.ts is out of date
        run: |
          if ! git diff --exit-code -- src/lib/supabase/database.types.ts; then
            echo "::error file=src/lib/supabase/database.types.ts::database.types.ts não bate com as migrations. Gere os tipos de novo (npm run db:types) numa sessão de nuvem e faça o commit."
            exit 1
          fi
