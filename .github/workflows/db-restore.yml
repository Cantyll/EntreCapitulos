name: Restaurar backup do banco

# SÓ à mão (Actions → Restaurar backup do banco → Run workflow) e só em um projeto Supabase NOVO e VAZIO.
# Nunca por cima da produção: o workflow recusa se o destino for o projeto de produção ou se o destino
# já tiver contas. Procedimento completo em docs/operacao.md, seção 15.
#
# Segurança: o gatilho é só workflow_dispatch (nunca pull_request); a confirmação digitada é conferida num
# job SEM segredos; o job que restaura usa o Environment "restore" (restrito à main e com aprovação
# obrigatória), que guarda os segredos do destino e duplica de propósito os do R2 e a frase-senha.
on:
  workflow_dispatch:
    inputs:
      backup:
        description: 'Backup a restaurar, como daily/AAAA-MM-DD ou weekly/AAAA-MM-DD'
        type: string
        required: true
      confirm:
        description: 'Digite RESTAURAR para confirmar'
        type: string
        required: true
      dry_run:
        description: 'Só simular: abre o backup, confere o destino e as migrations, sem alterar nada'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-restore
  cancel-in-progress: false

jobs:
  validate:
    name: Conferir a confirmação
    if: github.repository == 'Cantyll/EntreCapitulos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir a confirmação digitada
        env:
          CONFIRM: ${{ inputs.confirm }}
          BACKUP: ${{ inputs.backup }}
        run: |
          if [ "$CONFIRM" != "RESTAURAR" ]; then
            echo "::error::Confirmação errada. Digite exatamente RESTAURAR (em maiúsculas) para restaurar."
            exit 1
          fi
          if ! printf %s "$BACKUP" | grep -Eq '^(daily|weekly)/[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Informe o backup como daily/AAAA-MM-DD ou weekly/AAAA-MM-DD."
            exit 1
          fi

  restore:
    name: ${{ inputs.dry_run && 'Simular a restauração' || 'Restaurar no projeto novo' }}
    needs: validate
    if: github.repository == 'Cantyll/EntreCapitulos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Preparar pasta temporária
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          echo "BACKUP_WORKDIR=$RUNNER_TEMP/backup" >> "$GITHUB_ENV"

      - name: Restaurar
        run: bash scripts/backup/restore-remote.sh
        env:
          BACKUP_CHOICE: ${{ inputs.backup }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
          RESTORE_TARGET_PROJECT_REF: ${{ secrets.RESTORE_TARGET_PROJECT_REF }}
          RESTORE_TARGET_DB_PASSWORD: ${{ secrets.RESTORE_TARGET_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: Apagar os temporários
        if: always()
        run: |
          source scripts/backup/common.sh
          wipe_dir "$BACKUP_WORKDIR"
